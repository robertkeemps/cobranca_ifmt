<!DOCTYPE html>
<html xmlns="http://www.w3.org/1999/xhtml"
      xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastro de Título</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/css/bootstrap.min.css">
    <link rel="stylesheet" type="text/css" href="/css/bootstrap.min.css"/>
    <link rel="stylesheet" type="text/css" href="/css/style.css"/>
</head>
<body>

    <nav class="navbar navbar-dark bg-primary">
        <a class="navbar-brand" href="#">
            <img src="/images/ifmtlogo.png" width="50" height="50" alt="IFMT"/>
        </a>
    </nav>

    <div class="container mt-4">
        <form action="/titulos" method="POST">

            <!-- Alerta condicional do Thymeleaf (Páginas 11, 12 e 19 do PDF) -->
            <div class="alert alert-success alert-dismissible fade show" role="alert"
                 th:if="${!#strings.isEmpty(mensagem)}">
                <button type="button" class="close" data-dismiss="alert" aria-label="Close">
                    <span aria-hidden="true">&times;</span>
                </button>
                <span th:text="${mensagem}">Salvo com sucesso!</span>
            </div>

            <div class="card">
                <div class="card-header font-weight-bold">
                    <span>Novo título</span>
                </div>
                <div class="card-body">
                    
                    <div class="form-group row">
                        <label for="descricao" class="col-sm-2 col-form-label">Descrição</label>
                        <div class="col-sm-4">
                            <input type="text" class="form-control" id="descricao" placeholder="Descrição" name="descricao">
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="dataVencimento" class="col-sm-2 col-form-label">Data de Vencimento</label>
                        <div class="col-sm-2">
                            <input type="text" class="form-control" id="dataVencimento" name="dataVencimento" placeholder="dd/MM/aaaa"/>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="valor" class="col-sm-2 col-form-label">Valor</label>
                        <div class="col-sm-2">
                            <input type="text" class="form-control" id="valor" name="valor" placeholder="0,00"/>
                        </div>
                    </div>

                    <div class="form-group row">
                        <label for="status" class="col-sm-2 col-form-label">Status</label>
                        <div class="col-sm-2">
                            <select class="form-control" id="status" name="status">
                                <option value="PENDENTE">Pendente</option>
                                <option value="RECEBIDO">Recebido</option>
                            </select>
                        </div>
                    </div>

                    <div class="form-group row">
                        <div class="col-md-2 offset-md-2 col-sm-10">
                            <button type="submit" class="btn btn-primary">Salvar</button>
                        </div>
                    </div>

                </div>
            </div>
        </form>
    </div>

    <script src="https://code.jquery.com/jquery-3.4.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/popper.js@1.14.7/dist/umd/popper.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@4.3.1/dist/js/bootstrap.min.js"></script>
</body>
</html>
